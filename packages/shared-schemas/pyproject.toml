[project]
name = "arco-schemas"
version = "0.1.0"
description = "ARCO shared contracts: Pydantic models, hazard taxonomy, JSON Schema export"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/arco_schemas"]
