[project]
name = "arco-base-station"
version = "0.1.0"
description = "ARCO base station: receives feature packets, runs the ONNX tail, mask->polygon, georeferencing, hazards to the blackboard, per-stage telemetry"
requires-python = ">=3.11,<3.12"
dependencies = [
  "arco-schemas",
  "arco-edge-capture",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "opencv-python-headless>=4.10",
  "shapely>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "websockets>=12",
  "prometheus-client>=0.20",
  "psutil>=6.0",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "pyyaml>=6.0",
]

[project.scripts]
arco-base-station-serve = "arco_base.api:main"

[dependency-groups]
# Tests spin up the blackboard API in-process (REST is the runtime boundary).
dev = ["arco-blackboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arco_base"]
