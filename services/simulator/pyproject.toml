[project]
name = "arco-simulator"
version = "0.1.0"
description = "ARCO scenario player: replays scripted hazards + community events through the blackboard API on a scenario clock; synthetic street-feed generator; scenario validation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "arco-schemas",
  "arco-agents",
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "shapely>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
]

[project.scripts]
arco-sim = "arco_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arco_sim"]
