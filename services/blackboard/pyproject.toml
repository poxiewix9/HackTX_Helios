[project]
name = "arco-blackboard"
version = "0.1.0"
description = "ARCO blackboard: PostGIS schema, migrations, event bus, spatial API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "arco-schemas",
  "sqlalchemy>=2.0.35",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
]

[project.scripts]
arco-blackboard-migrate = "arco_blackboard.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arco_blackboard"]
