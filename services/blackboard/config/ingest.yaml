# Road-graph ingestion parameters. All values are documented approximations used to
# derive `base_cost` (seconds) and `capacity_estimate` (people per minute) per edge.
#
# base_cost = length_m / speed_m_s[highway]
#   Speeds model *evacuation* conditions (slow, congested), not free-flow limits.
# capacity_estimate = capacity_people_per_min[highway]
#   Rough throughput of mixed vehicle + pedestrian evacuation per direction. Order of
#   magnitude only; the Navigator's congestion model cares about relative values.

default_network_type: drive # osmnx network_type: drive | drive_service | walk | all

speed_m_s:
  motorway: 12.0
  motorway_link: 10.0
  trunk: 11.0
  trunk_link: 9.0
  primary: 10.0
  primary_link: 8.0
  secondary: 9.0
  secondary_link: 7.0
  tertiary: 8.0
  tertiary_link: 7.0
  unclassified: 7.0
  residential: 6.0
  living_street: 4.0
  service: 4.0
  track: 3.0
  footway: 1.3
  path: 1.2
  pedestrian: 1.3
  steps: 0.6
  cycleway: 3.0
  default: 6.0

capacity_people_per_min:
  motorway: 2400
  motorway_link: 1200
  trunk: 2000
  trunk_link: 1000
  primary: 1600
  primary_link: 800
  secondary: 1200
  secondary_link: 700
  tertiary: 900
  tertiary_link: 600
  unclassified: 600
  residential: 500
  living_street: 300
  service: 200
  track: 100
  footway: 240 # ~80 people/min per metre of width x ~3 m
  path: 160
  pedestrian: 400
  steps: 60
  cycleway: 200
  default: 400
