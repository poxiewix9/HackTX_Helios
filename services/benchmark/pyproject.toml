[project]
name = "arco-benchmark"
version = "0.1.0"
description = "ARCO benchmark harness: FP32 full model vs quantized split pipeline, measured per stage, JSON + CSV, recorded replay"
requires-python = ">=3.11,<3.12"
dependencies = [
  "arco-schemas",
  "arco-edge-capture",
  "arco-base-station",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "psutil>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
]

[project.scripts]
arco-bench = "arco_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arco_benchmark"]
