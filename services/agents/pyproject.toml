[project]
name = "arco-agents"
version = "0.1.0"
description = "ARCO agents: Cartographer, Navigator, Consensus (LangGraph, deterministic core)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "arco-schemas",
  "arco-blackboard",
  "langgraph>=0.2.30",
  "networkx>=3.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
arco-agents-serve = "arco_agents.api:main"
arco-agents-run = "arco_agents.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arco_agents"]
