[project]
name = "arco-monorepo"
version = "0.1.0"
description = "ARCO - Autonomous Relief Corridor Orchestrator (workspace root)"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/shared-schemas", "services/*"]

[tool.uv.sources]
arco-schemas = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pre-commit>=3.8",
  "types-PyYAML",
]

# ---------------------------------------------------------------------------
# Ruff: lint + format for every Python package in the workspace
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/alembic/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "ANN", "PL"]
ignore = [
  "ANN401",  # Any is sometimes required at boundaries
  "PLR2004", # magic values in tests / thresholds are commented in-line
  "PLR0913", # many-argument constructors are fine for data models
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "PLR"]
"**/alembic/env.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["arco_schemas", "arco_blackboard"]

# ---------------------------------------------------------------------------
# mypy: strict everywhere
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/shared-schemas/python:services/blackboard"
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "redis.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages/shared-schemas/tests", "services/blackboard/tests"]
markers = [
  "integration: requires docker-compose Postgres/Redis (skips if unreachable)",
]
asyncio_mode = "auto"
addopts = "-ra"
