name: arco

# Phase 1: infra (PostGIS + pgRouting, Redis) and the blackboard migration one-shot.
# Phase 2: blackboard API (REST + /ws/blackboard) on ${BLACKBOARD_PORT:-8001}.
# Phase 3: agents (Cartographer + Navigator, LangGraph) on ${AGENTS_PORT:-8003}.
# Later phases add: base-station, simulator, dashboard.
# Values come from .env (copy .env.example). Defaults below match .env.example.

services:
  postgres:
    image: pgrouting/pgrouting:16-3.5-3.8
    container_name: arco-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arco_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-arco}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arco} -d ${POSTGRES_DB:-arco}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: arco-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  blackboard-migrate:
    build:
      context: .
      dockerfile: services/blackboard/Dockerfile
    container_name: arco-blackboard-migrate
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arco}:${POSTGRES_PASSWORD:-arco_dev_password}@postgres:5432/${POSTGRES_DB:-arco}
      ARCO_LOG_LEVEL: ${ARCO_LOG_LEVEL:-INFO}
      ARCO_LOG_JSON: ${ARCO_LOG_JSON:-true}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "arco_blackboard.migrate"]
    restart: "no"

  blackboard:
    build:
      context: .
      dockerfile: services/blackboard/Dockerfile
    container_name: arco-blackboard
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arco}:${POSTGRES_PASSWORD:-arco_dev_password}@postgres:5432/${POSTGRES_DB:-arco}
      REDIS_URL: redis://redis:6379/0
      BLACKBOARD_PORT: 8001
      ARCO_LOG_LEVEL: ${ARCO_LOG_LEVEL:-INFO}
      ARCO_LOG_JSON: ${ARCO_LOG_JSON:-true}
    ports:
      - "${BLACKBOARD_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      blackboard-migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "arco_blackboard.api"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  agents:
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    container_name: arco-agents
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arco}:${POSTGRES_PASSWORD:-arco_dev_password}@postgres:5432/${POSTGRES_DB:-arco}
      REDIS_URL: redis://redis:6379/0
      AGENTS_PORT: 8003
      ARCO_SLM_ENABLED: ${ARCO_SLM_ENABLED:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ARCO_SLM_MODEL: ${ARCO_SLM_MODEL:-qwen2.5:1.5b-instruct}
      ARCO_POPULATION_PATH: /app/${ARCO_POPULATION_PATH:-data/samples/lahaina/demo_population.json}
      ARCO_LOG_LEVEL: ${ARCO_LOG_LEVEL:-INFO}
      ARCO_LOG_JSON: ${ARCO_LOG_JSON:-true}
    ports:
      - "${AGENTS_PORT:-8003}:8003"
    depends_on:
      blackboard:
        condition: service_healthy
    command: ["python", "-m", "arco_agents.api"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  base-station:
    build:
      context: .
      dockerfile: services/base-station/Dockerfile
    container_name: arco-base-station
    environment:
      ARCO_DETECTOR: ${ARCO_DETECTOR:-synthetic}
      ARCO_MODELS_DIR: /app/models
      ARCO_MODEL_ID: ${ARCO_MODEL_ID:-yolov8n-seg}
      ARCO_ORT_PROVIDERS: ${ARCO_ORT_PROVIDERS:-}
      BLACKBOARD_URL: http://blackboard:8001
      BASE_STATION_PORT: 8002
      ARCO_LOG_LEVEL: ${ARCO_LOG_LEVEL:-INFO}
      ARCO_LOG_JSON: ${ARCO_LOG_JSON:-true}
    volumes:
      - ./models:/app/models:ro # exported ONNX (scripts/export_split.py); unused when synthetic
    ports:
      - "${BASE_STATION_PORT:-8002}:8002"
    depends_on:
      blackboard:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Edge node streaming the SYNTHETIC source. Opt-in (it posts scripted hazards):
  #   docker compose --profile vision up -d edge-capture
  edge-capture:
    profiles: ["vision"]
    image: arco-base-station
    build:
      context: .
      dockerfile: services/base-station/Dockerfile
    container_name: arco-edge-capture
    environment:
      ARCO_DETECTOR: ${ARCO_DETECTOR:-synthetic}
      ARCO_MODELS_DIR: /app/models
      ARCO_MODEL_ID: ${ARCO_MODEL_ID:-yolov8n-seg}
      ARCO_EDGE_STREAM: ${ARCO_EDGE_STREAM:-micro}
      ARCO_EDGE_SOURCE: ${ARCO_EDGE_SOURCE:-synthetic}
      ARCO_EDGE_GEOREF_PATH: /app/${ARCO_EDGE_GEOREF_PATH:-data/samples/vision/georef/camera_front_st.json}
      ARCO_EDGE_FPS: ${ARCO_EDGE_FPS:-5}
      ARCO_BASE_STATION_URL: ws://base-station:8002/ws/features
      ARCO_LOG_LEVEL: ${ARCO_LOG_LEVEL:-INFO}
      ARCO_LOG_JSON: ${ARCO_LOG_JSON:-true}
    volumes:
      - ./models:/app/models:ro
    working_dir: /app/services/edge-capture
    command: ["python", "-m", "arco_edge.main"]
    depends_on:
      base-station:
        condition: service_healthy
    restart: unless-stopped

  # Benchmark telemetry: replays the committed recorded run (labelled RECORDED) on :8005 for
  # the dashboard's FP32-vs-split strip; POST /run starts a LIVE run when ./models has a manifest.
  benchmark:
    build:
      context: .
      dockerfile: services/benchmark/Dockerfile
    container_name: arco-benchmark
    environment:
      BENCHMARK_PORT: 8005
      ARCO_MODELS_DIR: /app/models
      ARCO_MODEL_ID: ${ARCO_MODEL_ID:-yolov8n-seg}
      ARCO_BENCH_REPLAY_SPEED: ${ARCO_BENCH_REPLAY_SPEED:-1.0}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "${BENCHMARK_PORT:-8005}:8005"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
