name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + schemas + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgrouting/pgrouting:16-3.5-3.8
        env:
          POSTGRES_USER: arco
          POSTGRES_PASSWORD: arco_dev_password
          POSTGRES_DB: arco
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arco -d arco"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://arco:arco_dev_password@localhost:5432/arco
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.13"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: |
          uv sync --all-packages --frozen
          pnpm install --frozen-lockfile

      - name: Lint (ruff, mypy, eslint, prettier, tsc)
        run: make lint

      - name: Schemas are up to date
        run: make schemas-check

      - name: Tests (unit + integration against service containers)
        run: make test

      - name: Blackboard image builds and migrates
        run: |
          docker build -f services/blackboard/Dockerfile -t arco-blackboard:ci .
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            arco-blackboard:ci python -m arco_blackboard.migrate
